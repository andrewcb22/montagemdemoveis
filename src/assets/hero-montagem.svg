<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Ilustração vetorial de montagem de móveis">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#f8e7bd"/>
      <stop offset="1" stop-color="#d6a84f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="155" fill="#ffffff" opacity="0.34"/>
  <circle cx="195" cy="145" r="98" fill="#ffffff" opacity="0.28"/>
  <path d="M0 610 C240 555 370 650 590 605 C790 564 934 575 1200 520 L1200 700 L0 700 Z" fill="#fff3bf" opacity="0.72"/>

  <!-- Finished furniture / wardrobe -->
  <g filter="url(#shadow)">
    <rect x="98" y="152" width="360" height="420" rx="30" fill="#ffffff"/>
    <rect x="128" y="185" width="140" height="330" rx="18" fill="url(#wood)"/>
    <rect x="288" y="185" width="140" height="330" rx="18" fill="#f4d98f"/>
    <line x1="278" y1="196" x2="278" y2="505" stroke="#b98b32" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <circle cx="247" cy="350" r="8" fill="#71511e"/>
    <circle cx="309" cy="350" r="8" fill="#71511e"/>
    <rect x="155" y="530" width="42" height="25" rx="8" fill="#7a5c2e"/>
    <rect x="358" y="530" width="42" height="25" rx="8" fill="#7a5c2e"/>
  </g>

  <!-- Tool box -->
  <g filter="url(#shadow)">
    <rect x="625" y="470" width="255" height="105" rx="26" fill="#111827"/>
    <rect x="690" y="432" width="122" height="62" rx="22" fill="none" stroke="#111827" stroke-width="20"/>
    <rect x="650" y="492" width="205" height="18" rx="9" fill="#facc15"/>
    <circle cx="752" cy="545" r="14" fill="#facc15"/>
  </g>

  <!-- Professional assembler -->
  <g filter="url(#shadow)">
    <circle cx="735" cy="198" r="54" fill="#f4c38b"/>
    <path d="M681 194 C702 130 775 130 795 194 C768 176 722 176 681 194Z" fill="#111827"/>
    <rect x="670" y="255" width="138" height="185" rx="48" fill="#111827"/>
    <rect x="694" y="275" width="92" height="130" rx="22" fill="#facc15"/>
    <path d="M664 306 L555 405" stroke="#111827" stroke-width="34" stroke-linecap="round"/>
    <path d="M800 312 L918 410" stroke="#111827" stroke-width="34" stroke-linecap="round"/>
    <circle cx="548" cy="412" r="19" fill="#f4c38b"/>
    <circle cx="925" cy="416" r="19" fill="#f4c38b"/>
    <rect x="882" y="400" width="100" height="24" rx="12" transform="rotate(22 882 400)" fill="#6b7280"/>
    <rect x="974" y="421" width="42" height="18" rx="9" transform="rotate(22 974 421)" fill="#111827"/>
    <path d="M710 438 L672 575" stroke="#111827" stroke-width="34" stroke-linecap="round"/>
    <path d="M778 438 L847 575" stroke="#111827" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- Assembly check card -->
  <g filter="url(#shadow)">
    <rect x="830" y="126" width="265" height="178" rx="30" fill="#ffffff"/>
    <circle cx="888" cy="205" r="37" fill="#dcfce7"/>
    <path d="M870 205 L884 219 L911 186" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="942" y="170" width="112" height="18" rx="9" fill="#111827" opacity="0.18"/>
    <rect x="942" y="207" width="86" height="18" rx="9" fill="#111827" opacity="0.12"/>
    <text x="858" y="275" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Serviço pronto</text>
  </g>

  <!-- Bottom message -->
  <g>
    <rect x="520" y="606" width="535" height="56" rx="28" fill="#ffffff" opacity="0.92"/>
    <text x="565" y="643" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111827">Montagem de móveis com cuidado</text>
  </g>
</svg>
